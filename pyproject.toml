[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "courtvision"
version = "0.1.0"
description = "Basketball video analytics for youth league games"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Computer vision pipeline (run on Colab GPU)
cv = [
    "inference-gpu>=0.29",
    "supervision>=0.25",
    "opencv-python-headless>=4.8",
    "scikit-learn>=1.3",
]
# Web app
app = ["gradio>=4.44"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
