[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "courtvision"
version = "0.1.0"
description = "Basketball video analytics for youth league games"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Computer vision pipeline (run on Colab GPU).
# Keep these loose: inference-gpu pins its own supervision, trackers and opencv-python
# versions (e.g. 1.8.5 needs supervision<0.31 and trackers~=2.4), and tighter pins here
# make pip unable to install. tracking.py works with trackers 2.4+ and old supervision.
cv = [
    "inference-gpu>=1.0",
    "supervision>=0.26",
    "trackers>=2.4",
    "scikit-learn>=1.3",
]
# Web app and PDF report
app = ["gradio>=4.44", "fpdf2>=2.7"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
